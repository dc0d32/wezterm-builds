name: Windows build

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-publication
  cancel-in-progress: false

jobs:
  poll:
    if: >-
      github.repository == 'dc0d32/wezterm-builds' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      snapshot: ${{ steps.poll.outputs.snapshot }}
      build_id: ${{ steps.poll.outputs.build_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: python3 -B -m unittest discover -s tests -v
      - id: poll
        run: python3 -B scripts/pipeline.py poll

  build-x64:
    needs: poll
    if: &build-if >-
      needs.poll.outputs.snapshot != '' &&
      github.repository == 'dc0d32/wezterm-builds' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env: &build-env
      SNAPSHOT: ${{ needs.poll.outputs.snapshot }}
      CARGO_INCREMENTAL: '0'
      RUSTUP_WINDOWS_PATH_ADD_BIN: '1'
      BUILD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Prepare fresh x64 source and cache identity
        id: prepare
        shell: pwsh
        run: ./control/scripts/build.ps1 -Phase Prepare -Architecture x86_64
      - name: Restore x64 crates.io downloads only
        id: registry
        uses: ./control/.github/actions/cache-restore
        with:
          path: .cargo-build/registry/cache
          key: ${{ steps.prepare.outputs.registry_key }}
          restore-keys: ${{ steps.prepare.outputs.registry_restore }}
      - name: Restore untrusted x64 compiled dependencies
        id: target
        uses: ./control/.github/actions/cache-restore
        with:
          path: candidate/target
          key: ${{ steps.prepare.outputs.target_key }}
          restore-keys: ${{ steps.prepare.outputs.target_restore }}
      - name: Restore isolated pinned x64 Nextest executable
        id: nextest
        uses: ./control/.github/actions/cache-restore
        with:
          path: .nextest/bin
          key: ${{ steps.prepare.outputs.nextest_key }}
      - name: Compile, natively test and upstream-package exact x64 commit
        id: compile
        shell: pwsh
        env:
          NEXTEST_CACHE_MATCHED: ${{ steps.nextest.outputs.cache-matched-key }}
        run: ./control/scripts/build.ps1 -Phase Compile -Architecture x86_64
      - name: Validate successful x64 build caches
        if: &save-if >-
          success() && steps.compile.outcome == 'success' &&
          github.repository == 'dc0d32/wezterm-builds' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: python -B control/scripts/build_cache.py validate
      - name: Save x64 crates.io downloads
        if: >-
          success() && steps.compile.outcome == 'success' &&
          steps.registry.outputs.cache-hit != 'true' &&
          github.repository == 'dc0d32/wezterm-builds' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cargo-build/registry/cache
          key: ${{ steps.prepare.outputs.registry_key }}
      - name: Save x64 compiled dependencies
        if: >-
          success() && steps.compile.outcome == 'success' &&
          steps.target.outputs.cache-hit != 'true' &&
          github.repository == 'dc0d32/wezterm-builds' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: candidate/target
          key: ${{ steps.prepare.outputs.target_key }}
      - name: Save isolated x64 Nextest executable
        if: >-
          success() && steps.compile.outcome == 'success' &&
          steps.nextest.outputs.cache-hit != 'true' &&
          github.repository == 'dc0d32/wezterm-builds' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nextest/bin
          key: ${{ steps.prepare.outputs.nextest_key }}
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-x86_64-${{ fromJSON(needs.poll.outputs.snapshot).request.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/*
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 7

  build-arm64:
    needs: poll
    if: *build-if
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env: *build-env
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Prepare fresh ARM64 source and cache identity
        id: prepare
        shell: pwsh
        run: ./control/scripts/build.ps1 -Phase Prepare -Architecture aarch64
      - name: Restore ARM64 crates.io downloads only
        id: registry
        uses: ./control/.github/actions/cache-restore
        with:
          path: .cargo-build/registry/cache
          key: ${{ steps.prepare.outputs.registry_key }}
          restore-keys: ${{ steps.prepare.outputs.registry_restore }}
      - name: Restore untrusted ARM64 compiled dependencies
        id: target
        uses: ./control/.github/actions/cache-restore
        with:
          path: candidate/target
          key: ${{ steps.prepare.outputs.target_key }}
          restore-keys: ${{ steps.prepare.outputs.target_restore }}
      - name: Cross-compile, compile tests and narrowly package exact ARM64 commit
        id: compile
        shell: pwsh
        run: ./control/scripts/build.ps1 -Phase Compile -Architecture aarch64
      - name: Validate successful ARM64 build caches
        if: *save-if
        shell: pwsh
        run: python -B control/scripts/build_cache.py validate
      - name: Save ARM64 crates.io downloads
        if: >-
          success() && steps.compile.outcome == 'success' &&
          steps.registry.outputs.cache-hit != 'true' &&
          github.repository == 'dc0d32/wezterm-builds' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cargo-build/registry/cache
          key: ${{ steps.prepare.outputs.registry_key }}
      - name: Save ARM64 compiled dependencies
        if: >-
          success() && steps.compile.outcome == 'success' &&
          steps.target.outputs.cache-hit != 'true' &&
          github.repository == 'dc0d32/wezterm-builds' &&
          github.ref_name == github.event.repository.default_branch &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: candidate/target
          key: ${{ steps.prepare.outputs.target_key }}
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-aarch64-${{ fromJSON(needs.poll.outputs.snapshot).request.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/*
          if-no-files-found: error
          overwrite: false
          compression-level: 0
          retention-days: 7

  validate-arm64:
    needs: [poll, build-arm64]
    if: >-
      needs.build-arm64.result == 'success' &&
      github.repository == 'dc0d32/wezterm-builds' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-11-arm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      SNAPSHOT: ${{ needs.poll.outputs.snapshot }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.build-arm64.outputs.artifact_id }}
          path: arm-package
      - name: Revalidate ARM64 package and extract executable allowlist
        shell: pwsh
        run: python -B control/scripts/pipeline.py validate-arm64
      - name: Run native ARM64 CLI, ConPTY child and software-renderer smoke tests
        shell: pwsh
        run: ./control/scripts/arm64-smoke.ps1

  publish:
    needs: [poll, build-x64, build-arm64, validate-arm64]
    if: >-
      needs.build-x64.result == 'success' &&
      needs.build-arm64.result == 'success' &&
      needs.validate-arm64.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      SNAPSHOT: ${{ needs.poll.outputs.snapshot }}
      ARTIFACT_X64_ID: ${{ needs.build-x64.outputs.artifact_id }}
      ARTIFACT_ARM64_ID: ${{ needs.build-arm64.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Validate both artifacts and publish without executing candidate code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B control/scripts/pipeline.py publish
